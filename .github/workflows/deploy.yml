name: Auto Deploy SarkariAfsar

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            set -e
            cd /home/ubuntu/apps/sarkariafsar

            git pull origin main

            # API / server
            cd server
            npm install

            # server/.env from GitHub secrets
            {
              echo "SCRAPPER_PORT=5000"
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
              echo "GOOGLE_CALLBACK_URL=http://localhost:5000/api/auth/google/callback"
              echo "PRODUCTION_CALLBACK_URL=https://sarkariafsar.com/api/auth/google/callback"
              echo "SCRAPPER_MONGO_URI=${{ secrets.SCRAPPER_MONGO_URI }}"
              echo "MAIL_SERVICE=gmail"
              echo "MAIL_USER=${{ secrets.MAIL_USER }}"
              echo "MAIL_PASS=${{ secrets.MAIL_PASS }}"
              echo "ALERT_MAIL_TO=${{ secrets.ALERT_MAIL_TO }}"
              echo "MAIL_PORT=465"
              echo "GEMINI_API_KEYS=${{ secrets.GEMINI_API_KEYS }}"
              echo "GEMINI_MODELS=gemini-2.5-flash,gemini-flash-latest,gemini-2.0-flash,gemini-2.0-flash-001,gemini-2.0-flash-lite,gemini-2.0-flash-lite-001,gemini-2.5-flash-lite,gemini-flash-lite-latest"
              echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}"
              echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}"
              echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}"
              echo "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}"
              echo "R2_PUBLIC_DOMAIN=${{ secrets.R2_PUBLIC_DOMAIN }}"
              echo "CASHFREE_APP_ID=${{ secrets.CASHFREE_APP_ID }}"
              echo "CASHFREE_SECRET_KEY=${{ secrets.CASHFREE_SECRET_KEY }}"
              echo "CASHFREE_ENV=PRODUCTION"
              echo "SERVER_URL=https://sarkariafsar.com"
              echo "FRONTEND_URL=https://sarkariafsar.com"
            } > .env

            echo "=== server/.env GOOGLE_CALLBACK_URL check ==="
            grep "GOOGLE_CALLBACK_URL" .env || true

            # Frontend build
            cd ../front
            npm install
            npm run build

            # Panel build
            cd ../panel
            npm install
            npm run build

            # PM2 restart via ecosystem
            cd ..
            pm2 start ecosystem.config.cjs --update-env
            pm2 restart all --update-env
            pm2 save --force